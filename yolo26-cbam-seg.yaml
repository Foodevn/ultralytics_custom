# Ultralytics YOLO26-cbam-seg instance segmentation model
# Custom architecture for Strawberry Defect Detection

# Parameters
nc: 5 # Đổi từ 80 thành 4 cho các loại khuyết tật dâu tây
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  n: [0.50, 0.25, 1024] 
  s: [0.50, 0.50, 1024] 
  m: [0.50, 1.00, 512]  
  l: [1.00, 1.00, 512]  
  x: [1.00, 1.50, 512]  

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10
  - [-1, 1, CBAM, [1024]] # 11: <--- CHÈN MODULE CBAM VÀO ĐÂY

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 6], 1, Concat, [1]] # 13: cat backbone P4 (Vẫn là 6 vì nằm trên CBAM)
  - [-1, 2, C3k2, [512, True]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 4], 1, Concat, [1]] # 16: cat backbone P3 (Vẫn là 4 vì nằm trên CBAM)
  - [-1, 2, C3k2, [256, True]] # 17 (P3/8-small) - ĐẦU RA 1

  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 14], 1, Concat, [1]] # 19: cat head P4 (Đổi index từ 13 -> 14)
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16-medium) - ĐẦU RA 2

  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 11], 1, Concat, [1]] # 22: cat head P5 (Đổi index từ 10 -> 11, nối thẳng vào CBAM)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 (P5/32-large) - ĐẦU RA 3

  - [[17, 20, 23], 1, Segment26, [nc, 32, 256]] # 24: Segment26 lấy từ (P3, P4, P5 mới)